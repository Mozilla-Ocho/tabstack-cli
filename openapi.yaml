          type: string
        researchPlan:
          type: string
        researchQuestions:
          items:
            type: string
          type: array
        totalPagesAnalyzed:
          description: Total pages analyzed across all iterations
          type: number
        urlSources:
          additionalProperties: false
          properties:
            extractedLinks:
              type: number
            searchResults:
              type: number
            userProvided:
              type: number
          required:
            - userProvided
            - searchResults
            - extractedLinks
          type: object
      required:
