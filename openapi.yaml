openapi: 3.0.3
info:
  contact: {}
  description: Production API for web content extraction, transformation, research, and automation. Organize your workflows with semantic endpoints for extracting structured data, generating AI-powered content, conducting research, and automating browser tasks.
  title: tabs-api
  version: "1.0"
servers:
  - url: https://api.tabstack.ai/v1
paths:
  /automate:
    post:
      description: |-
        Execute AI-powered browser automation tasks using natural language with optional geotargeting. This endpoint **always streams** responses using Server-Sent Events (SSE).

        **Streaming Response:**
        - All responses are streamed using Server-Sent Events (`text/event-stream`)
        - Real-time progress updates and results as they're generated

        **Geotargeting:**
        - Optionally specify a country code for geotargeted browsing

        **Use Cases:**
        - Web scraping and data extraction
        - Form filling and interaction
        - Navigation and information gathering
        - Multi-step web workflows
        - Content analysis from web pages
      operationId: automateV1
      requestBody:
        content:
          application/json:
            examples:
              dataExtraction:
                summary: Extract trending repositories
                value:
                  guardrails: browse and extract only, don't interact with repositories
                  task: Find the top 3 trending repositories and extract their names, descriptions, and star counts
                  url: https://github.com/trending
              formFilling:
                summary: Fill out contact form
                value:
                  data:
                    email: alex@example.com
                    message: Interested in learning more about your enterprise plan
                    name: Alex Johnson
                  task: Submit the contact form with my information
                  url: https://company.com/contact
              webScraping:
                summary: Scrape product information
                value:
                  guardrails: extract product details only, don't add to cart or checkout
                  task: Find the product name, price, and availability status
                  url: https://example-store.com/product/wireless-headphones
            schema:
              $ref: '#/components/schemas/v1.AutomateRequest'
        description: Request body with optional geotargeting
        required: true
      responses:
        "200":
          content:
            text/event-stream:
              examples:
                githubTrending:
                  summary: Extract GitHub trending repositories
                  value: |
                    event: start
                    data: {"task": "Find the top 3 trending repositories", "url": "https://github.com/trending"}

                    event: agent:processing
                    data: {"operation": "Creating task plan", "hasScreenshot": false}

                    event: browser:navigated
                    data: {"title": "Trending - GitHub", "url": "https://github.com/trending"}

                    event: agent:extracted
                    data: {"extractedData": "[{\"name\": \"awesome-ai\", \"stars\": \"45.2k\"}]"}

                    event: task:completed
                    data: {"success": true, "finalAnswer": "Top 3 trending repos extracted"}

                    event: complete
                    data: {"success": true}

                    event: done
                    data: {}
                productLookup:
                  summary: Extract product information
                  value: |
                    event: start
                    data: {"task": "Find product details", "url": "https://store.com/product"}

                    event: browser:navigated
                    data: {"title": "Product Page", "url": "https://store.com/product"}

                    event: agent:extracted
                    data: {"extractedData": "{\"name\": \"Headphones\", \"price\": \"$299.99\"}"}

                    event: task:completed
                    data: {"success": true}

                    event: done
                    data: {}
              schema:
                $ref: '#/components/schemas/v1.AutomateEvent'
          description: |
            Task executed successfully (always streaming)

            **Streaming Response using Server-Sent Events:**
            All responses from the automate endpoint are streamed using Server-Sent Events.

            **Event Format:**
            - Each event starts with `event: <type>` followed by `data: <JSON>`
            - Empty lines separate events

            **Event Types:**

            **Task Events:**
            - `start`: Task initialization
            - `task:setup`: Task configuration
            - `task:started`: Task execution begins
            - `task:completed`: Task finished successfully
            - `task:aborted`: Task was terminated
            - `task:validated`: Task completion validation
            - `task:validation_error`: Validation failed

            **Agent Events:**
            - `agent:processing`: Agent thinking/planning
            - `agent:status`: Status updates and plans
            - `agent:step`: Processing step iterations
            - `agent:action`: Actions being performed
            - `agent:reasoned`: Agent reasoning output
            - `agent:extracted`: Data extraction results
            - `agent:waiting`: Agent waiting for operations

            **Browser Events:**
            - `browser:navigated`: Page navigation events
            - `browser:action_started`: Browser action initiated
            - `browser:action_completed`: Browser action finished
            - `browser:screenshot_captured`: Screenshot taken

            **System Events:**
            - `system:debug_compression`: Debug compression info
            - `system:debug_message`: Debug messages

            **Stream Control:**
            - `complete`: End of stream with results
            - `done`: Stream termination
            - `error`: Error occurred
        "400":
          content:
            application/json:
              examples:
                invalidIterations:
                  value:
                    error: maxIterations must be between 1 and 100
                invalidUrl:
                  value:
                    error: invalid URL format
                missingTask:
                  value:
                    error: task is required
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Bad request - Invalid task or missing required fields
        "401":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Unauthorized - Invalid or missing Bearer token
        "500":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Internal server error
        "503":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Service unavailable - Automate service not configured
      security:
        - BearerAuth: []
      summary: AI Task
      tags:
        - Automate
      x-position: 4
  /automate/{requestID}/input:
    post:
      description: |-
        Submit a response to an interactive form data request from an in-progress automation task. When the AI agent encounters a form requiring user data, it emits an `interactive:form_data:request` or `interactive:form_data:error` SSE event containing a `requestId`. Use this endpoint to provide the requested data or cancel the request.

        **Lifecycle:**
        - Input requests expire after 2 minutes by default
        - Expired or already-answered requests return `410 Gone`
        - Successful submissions return `202 Accepted` (fire-and-forget from caller's perspective)
      operationId: automateInputV1
      parameters:
        - description: The request ID from the interactive:form_data:request SSE event
          in: path
          name: requestID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1.AutomateInputRequest'
        description: Input response with field values or cancellation
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.AutomateInputResponse'
          description: Input response accepted and forwarded to the automation task
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Bad request - Invalid JSON
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Unauthorized - Invalid or missing Bearer token
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Gone - Input request has expired or already been answered
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Internal server error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Service unavailable - Input service not configured
      security:
        - BearerAuth: []
      summary: Submit Input Response
      tags:
        - Automate
  /extract/json:
    post:
      description: Fetches a URL and extracts structured data according to a provided JSON schema
      operationId: extractJsonV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1.ExtractJSONRequest'
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ExtractJSONResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                invalidJson:
                  value:
                    error: invalid JSON request body
                invalidSchema:
                  value:
                    error: json schema must be a valid object
                missingSchema:
                  value:
                    error: json schema is required
                missingUrl:
                  value:
                    error: url is required
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Bad request - invalid input
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Unauthorized - Invalid or missing Bearer token
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Invalid URL or inaccessible resource
        "500":
          content:
            application/json:
              examples:
                fetchError:
                  value:
                    error: failed to fetch URL
                generationError:
                  value:
                    error: failed to generate JSON
                tooLarge:
                  value:
                    error: web page is too large
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Server error
      security:
        - BearerAuth: []
      summary: JSON
      tags:
        - Extract
      x-position: 2
  /extract/markdown:
    post:
      description: Fetches a URL and converts its HTML content to clean Markdown format with optional metadata extraction
      operationId: extractMarkdownV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1.ExtractMarkdownRequest'
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                withMetadata:
                  summary: Response with separate metadata field (when metadata=true)
                  value:
                    content: |-
                      # Example Article Title

                      This is the article content converted to markdown...
                    metadata:
                      author: Example Author
                      description: This is an example article description
                      image: https://example.com/images/article.jpg
                      publisher: Example Publisher
                      site_name: Example Blog
                      title: Example Article Title
                      type: article
                      url: https://example.com/blog/article
                    url: https://example.com/blog/article
                withoutMetadata:
                  summary: Default response (metadata in YAML frontmatter)
                  value:
                    content: |-
                      ---
                      title: Example Article Title
                      description: This is an example article description
                      author: Example Author
                      publisher: Example Publisher
                      image: https://example.com/images/article.jpg
                      site_name: Example Blog
                      url: https://example.com/blog/article
                      type: article
                      ---

                      # Example Article Title

                      This is the article content converted to markdown...
                    url: https://example.com/blog/article
              schema:
                $ref: '#/components/schemas/v1.ExtractMarkdownResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Bad request - URL is required
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Unauthorized - Invalid or missing Bearer token
        "422":
          content:
            application/json:
              examples:
                internalResource:
                  value:
                    error: access to internal resources is not allowed
                invalidUrl:
                  value:
                    error: url is invalid
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Invalid URL or inaccessible resource
        "500":
          content:
            application/json:
              examples:
                conversionError:
                  value:
                    error: failed to convert HTML to Markdown
                fetchError:
                  value:
                    error: failed to fetch URL
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Server error
      security:
        - BearerAuth: []
      summary: Markdown
      tags:
        - Extract
      x-position: 1
  /generate/json:
    post:
      description: Fetches URL content, extracts data, and transforms it using AI based on custom instructions. Use this to generate new content, summaries, or restructured data.
      operationId: generateJsonV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1.GenerateJSONRequest'
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.GenerateJSONResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                invalidJson:
                  value:
                    error: invalid JSON request body
                invalidSchema:
                  value:
                    error: json schema must be a valid object
                missingInstructions:
                  value:
                    error: instructions are required
                missingSchema:
                  value:
                    error: json schema is required
                missingUrl:
                  value:
                    error: url is required
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Bad request - invalid input
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Unauthorized - Invalid or missing Bearer token
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Invalid URL or inaccessible resource
        "500":
          content:
            application/json:
              examples:
                fetchError:
                  value:
                    error: failed to fetch URL
                tooLarge:
                  value:
                    error: web page is too large
                transformError:
                  value:
                    error: failed to transform data
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Server error
      security:
        - BearerAuth: []
      summary: JSON
      tags:
        - Generate
      x-position: 3
  /research:
    post:
      description: |-
        Execute AI-powered research queries that search the web, analyze sources, and synthesize comprehensive answers. This endpoint **always streams** responses using Server-Sent Events (SSE).

        **Streaming Response:**
        - All responses are streamed using Server-Sent Events (`text/event-stream`)
        - Real-time progress updates as research progresses through phases

        **Research Modes:**
        - `fast` - Quick answers with minimal web searches (default)
        - `balanced` - Standard research with multiple iterations

        **Use Cases:**
        - Answering complex questions with cited sources
        - Synthesizing information from multiple web sources
        - Research reports on specific topics
        - Fact-checking and verification tasks
      operationId: researchV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1.ResearchRequest'
        description: Request body
        required: true
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ResearchEvent'
          description: SSE stream with research progress and results
        "400":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Bad request - Invalid query or missing required fields
        "401":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Unauthorized - Invalid or missing Bearer token
        "500":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Internal server error
        "503":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v1.ErrorResponse'
          description: Service unavailable - Research service not configured
      security:
        - BearerAuth: []
      summary: Research
      tags:
        - Research
components:
  schemas:
    api_v1.ExtractJSONRequest:
      properties:
        effort:
          example: standard
        json_schema:
          example:
            properties:
              stories:
                items:
                  properties:
                    author:
                      description: Author username
                      type: string
                    points:
                      description: Story points
                      type: number
                    title:
                      description: Story title
                      type: string
                  type: object
                type: array
            type: object
    api_v1.ExtractJSONResponse:
      description: The extracted data matching the provided schema
      example:
        stories:
          - author: techuser
            points: 342
            title: New AI Model Released
          - author: dbexpert
            points: 156
            title: Database Performance Tips
    api_v1.GenerateJSONRequest:
      properties:
        effort:
          example: standard
        json_schema:
          example:
            properties:
              summaries:
                items:
                  properties:
                    category:
                      description: Story category (tech/business/science/etc)
                      type: string
                    summary:
                      description: One-sentence summary of the story
                      type: string
                    title:
                      description: Story title
                      type: string
                  type: object
                type: array
            type: object
    api_v1.GenerateJSONResponse:
      description: The transformed data matching the provided schema
      example:
        summaries:
          - category: tech
            summary: A research lab announced a new large language model that achieves state-of-the-art performance on reasoning tasks.
            title: New AI Model Released
          - category: tech
            summary: An engineer shares optimization techniques that reduced their database query times by 90%.
            title: Database Performance Tips
          - category: business
            summary: A company developing carbon capture technology secured $50M in Series B funding.
            title: Climate Tech Startup Raises Funding
    geotarget.GeoTarget:
      properties:
        country:
          description: |-
            Country code using ISO 3166-1 alpha-2 standard (2 letters, e.g., "US", "GB", "JP").
            See: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
          example: US
          type: string
      type: object
    pagemetadata.Metadata:
      properties:
        author:
          description: Author information from HTML metadata
          example: Example Author
          type: string
          x-order: "2"
        created_at:
          description: Document creation date (ISO 8601)
          example: 2024-01-15T10:30:00Z
          type: string
          x-order: "10"
        creator:
          description: Creator application (e.g., "Microsoft Word")
          example: Microsoft Word
          type: string
          x-order: "12"
        description:
          description: Page description from Open Graph or HTML
          example: This is an example article description
          type: string
          x-order: "1"
        favicon:
          description: Favicon URL (resolved to absolute) parsed from <link rel="icon"> / "shortcut icon" / "apple-touch-icon"
          example: https://example.com/favicon.ico
          format: uri
          type: string
          x-order: "16"
        image:
          description: Featured image URL from Open Graph
          example: https://example.com/images/article.jpg
          format: uri
          type: string
          x-order: "4"
        keywords:
          description: PDF keywords as array
          example:
            - keyword1
            - keyword2
          items:
            type: string
          type: array
          x-order: "9"
        modified_at:
          description: Document modification date (ISO 8601)
          example: 2024-01-20T15:45:00Z
          type: string
          x-order: "11"
        page_count:
          description: Number of pages (PDF documents)
          example: 42
          type: integer
          x-order: "14"
        pdf_version:
          description: PDF version (e.g., "1.5")
          example: "1.5"
          type: string
          x-order: "15"
        producer:
          description: PDF producer software (e.g., "Adobe PDF Library")
          example: Adobe PDF Library 15.0
          type: string
          x-order: "13"
        publisher:
          description: Publisher information from Open Graph
          example: Example Publisher
          type: string
          x-order: "3"
        site_name:
          description: Site name from Open Graph
          example: Example Blog
          type: string
          x-order: "5"
        subject:
          description: |-
            PDF-specific metadata fields (populated for PDF documents)
            PDF subject or summary
          example: Document subject
          type: string
          x-order: "8"
        title:
          description: Page title from Open Graph or HTML
          example: Example Article Title
          type: string
          x-order: "0"
        type:
          description: Content type from Open Graph (e.g., article, website)
          example: article
          type: string
          x-order: "7"
        url:
          description: Canonical URL from Open Graph
          example: https://example.com/blog/article
          format: uri
          type: string
          x-order: "6"
      type: object
    tabs-api_internal_pilo.Request:
      properties:
        data:
          example:
            language: Python
            timeRange: today
    v1.AutomateEvent:
      type: object
      description: A Server-Sent Event from /v1/automate. Typed discriminated union keyed on event.
      required:
        - event
        - data
      discriminator:
        propertyName: event
        mapping:
          agent:action: '#/components/schemas/v1.AutomateEvent_AgentAction'
          agent:extracted: '#/components/schemas/v1.AutomateEvent_AgentExtracted'
          agent:processing: '#/components/schemas/v1.AutomateEvent_AgentProcessing'
          agent:reasoned: '#/components/schemas/v1.AutomateEvent_AgentReasoned'
          agent:status: '#/components/schemas/v1.AutomateEvent_AgentStatus'
          agent:step: '#/components/schemas/v1.AutomateEvent_AgentStep'
          agent:waiting: '#/components/schemas/v1.AutomateEvent_AgentWaiting'
          ai:generation: '#/components/schemas/v1.AutomateEvent_AiGeneration'
          ai:generation:error: '#/components/schemas/v1.AutomateEvent_AiGenerationError'
          browser:action_completed: '#/components/schemas/v1.AutomateEvent_BrowserActionCompleted'
          browser:action_started: '#/components/schemas/v1.AutomateEvent_BrowserActionStarted'
          browser:navigated: '#/components/schemas/v1.AutomateEvent_BrowserNavigated'
          browser:reconnected: '#/components/schemas/v1.AutomateEvent_BrowserReconnected'
          browser:screenshot_captured: '#/components/schemas/v1.AutomateEvent_BrowserScreenshotCaptured'
          browser:screenshot_captured_image: '#/components/schemas/v1.AutomateEvent_BrowserScreenshotCapturedImage'
          cdp:endpoint_connected: '#/components/schemas/v1.AutomateEvent_CdpEndpointConnected'
          cdp:endpoint_cycle: '#/components/schemas/v1.AutomateEvent_CdpEndpointCycle'
          complete: '#/components/schemas/v1.AutomateEvent_Complete'
          done: '#/components/schemas/v1.AutomateEvent_Done'
          error: '#/components/schemas/v1.AutomateEvent_Error'
          interactive:form_data:error: '#/components/schemas/v1.AutomateEvent_InteractiveFormDataError'
          interactive:form_data:request: '#/components/schemas/v1.AutomateEvent_InteractiveFormDataRequest'
          system:debug_compression: '#/components/schemas/v1.AutomateEvent_SystemDebugCompression'
          system:debug_message: '#/components/schemas/v1.AutomateEvent_SystemDebugMessage'
          task:aborted: '#/components/schemas/v1.AutomateEvent_TaskAborted'
          task:completed: '#/components/schemas/v1.AutomateEvent_TaskCompleted'
          task:metrics: '#/components/schemas/v1.AutomateEvent_TaskMetrics'
          task:metrics_incremental: '#/components/schemas/v1.AutomateEvent_TaskMetricsIncremental'
          task:setup: '#/components/schemas/v1.AutomateEvent_TaskSetup'
          task:started: '#/components/schemas/v1.AutomateEvent_TaskStarted'
          task:trace_context: '#/components/schemas/v1.AutomateEvent_TaskTraceContext'
          task:validated: '#/components/schemas/v1.AutomateEvent_TaskValidated'
          task:validation_error: '#/components/schemas/v1.AutomateEvent_TaskValidationError'
      oneOf:
        - $ref: '#/components/schemas/v1.AutomateEvent_AgentAction'
        - $ref: '#/components/schemas/v1.AutomateEvent_AgentExtracted'
        - $ref: '#/components/schemas/v1.AutomateEvent_AgentProcessing'
        - $ref: '#/components/schemas/v1.AutomateEvent_AgentReasoned'
        - $ref: '#/components/schemas/v1.AutomateEvent_AgentStatus'
        - $ref: '#/components/schemas/v1.AutomateEvent_AgentStep'
        - $ref: '#/components/schemas/v1.AutomateEvent_AgentWaiting'
        - $ref: '#/components/schemas/v1.AutomateEvent_AiGeneration'
        - $ref: '#/components/schemas/v1.AutomateEvent_AiGenerationError'
        - $ref: '#/components/schemas/v1.AutomateEvent_BrowserActionCompleted'
        - $ref: '#/components/schemas/v1.AutomateEvent_BrowserActionStarted'
        - $ref: '#/components/schemas/v1.AutomateEvent_BrowserNavigated'
        - $ref: '#/components/schemas/v1.AutomateEvent_BrowserReconnected'
        - $ref: '#/components/schemas/v1.AutomateEvent_BrowserScreenshotCaptured'
        - $ref: '#/components/schemas/v1.AutomateEvent_BrowserScreenshotCapturedImage'
        - $ref: '#/components/schemas/v1.AutomateEvent_CdpEndpointConnected'
        - $ref: '#/components/schemas/v1.AutomateEvent_CdpEndpointCycle'
        - $ref: '#/components/schemas/v1.AutomateEvent_Complete'
        - $ref: '#/components/schemas/v1.AutomateEvent_Done'
        - $ref: '#/components/schemas/v1.AutomateEvent_Error'
        - $ref: '#/components/schemas/v1.AutomateEvent_InteractiveFormDataError'
        - $ref: '#/components/schemas/v1.AutomateEvent_InteractiveFormDataRequest'
        - $ref: '#/components/schemas/v1.AutomateEvent_SystemDebugCompression'
        - $ref: '#/components/schemas/v1.AutomateEvent_SystemDebugMessage'
        - $ref: '#/components/schemas/v1.AutomateEvent_TaskAborted'
        - $ref: '#/components/schemas/v1.AutomateEvent_TaskCompleted'
        - $ref: '#/components/schemas/v1.AutomateEvent_TaskMetrics'
        - $ref: '#/components/schemas/v1.AutomateEvent_TaskMetricsIncremental'
        - $ref: '#/components/schemas/v1.AutomateEvent_TaskSetup'
