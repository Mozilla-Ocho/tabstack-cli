    v1.ResearchMetadata:
      additionalProperties: false
      description: |-
        Research metadata

        Note: citedPages, gapEvaluations, outline, and judgments are optional to support fast mode, which skips these phases for maximum speed.
      properties:
        citedPages:
          description: Pages cited in the report, ordered by first citation appearance
          items:
            additionalProperties: false
            properties:
              claims:
                items:
                  type: string
                type: array
              depth:
                type: number
              fullText:
                description: |-
                  Full page text (fetched markdown or search excerpts). Only populated when `includeFullText: true` in ResearchOptions.
                  - Fast mode: Parallel API excerpts (~5000 chars)
                  - Other modes: Fetched page markdown
                type: string
              id:
                type: string
              parentUrl:
                type: string
              relevance:
                enum:
                  - low
                  - medium
                  - high
                type: string
              reliability:
                enum:
                  - low
                  - medium
                  - high
                type: string
              sourceQueries:
                items:
                  type: string
                type: array
              summary:
                description: LLM-generated summary. Undefined in fast mode (no content analysis).
                type: string
              title:
                type: string
              url:
                type: string
              urlSource:
                $ref: '#/components/schemas/v1.UrlSource'
            required:
              - id
              - url
              - sourceQueries
              - claims
            type: object
          type: array
        executedQueries:
          items:
            items:
              type: string
            type: array
          type: array
        gapEvaluations:
          items:
            $ref: '#/components/schemas/v1.GapEvaluation'
          type: array
